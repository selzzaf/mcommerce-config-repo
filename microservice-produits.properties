#Configurations H2
spring.jpa.show-sql=true
spring.h2.console.enabled=true
#defini l'encodage pour data.sql
spring.datasource.sql-script-encoding=UTF-8

#Eureka : indique l'URL d'Eureka a laquelle il faut s'enregistrer (TP4)
eureka.client.serviceUrl.defaultZone=http://localhost:9102/eureka/

#Actuator (TP3.2) : expose tous les endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

#Les configurations externalisees (TP3.1)
mes-configs.limitDeProduits=3
